<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Commitment Review</title>
<script src="demo-api.js"></script>
<style>
  :root{
    --bg:#ffffff;--surface:#f4f8ff;--surface-2:#eaf2ff;--line:#d6e4fb;
    --ink:#0a2a5c;--ink-2:#4a6490;--blue:#1769ff;--blue-deep:#0b3d91;--blue-soft:#cfe0ff;
    --ok:#0f7b4f;--ok-bg:#e6f6ee;--bad:#b3261e;--bad-bg:#fdecea;--wait:#7a5a00;--wait-bg:#fff8e6;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--surface);color:var(--ink);min-height:100vh}
  button,input,select,textarea{font:inherit;color:inherit}
  header{background:var(--bg);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:700}
  h1{font-size:22px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block}
  .btn:hover{background:var(--surface)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.approve{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.reject{color:var(--bad);border-color:#f2c4c0}
  .btn.reject:hover{background:var(--bad-bg)}
  main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
  .login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;display:flex;flex-direction:column;gap:14px}
  .login input{border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .error{color:var(--bad);font-size:14px;font-weight:600;min-height:1em}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}
  .tabs,.lv{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
  .tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .tab em{font-style:normal;opacity:.7;margin-left:4px}
  .list{display:flex;flex-direction:column;gap:12px}
  .item{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;grid-template-columns:1fr 260px;gap:18px}
  @media (max-width:820px){.item{grid-template-columns:1fr}}
  .item textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.5;resize:vertical}
  .fields{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
  .fields label{font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
  .fields input,.fields select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:14px}
  .side{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink-2)}
  .side b{color:var(--ink)}
  .status{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
  .status.pending{background:var(--wait-bg);color:var(--wait)}
  .status.approved{background:var(--ok-bg);color:var(--ok)}
  .status.rejected{background:var(--bad-bg);color:var(--bad)}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .note{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;width:100%}
  .empty{text-align:center;padding:48px;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--radius);background:#fff}
  .lvl{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--blue-deep)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div><span class="eyebrow">Commitment Board</span><h1>Review &amp; verification</h1></div>
  <div id="topActions" hidden style="display:flex;gap:8px;flex-wrap:wrap">
    <a class="btn" href="index.html">Open board ↗</a>
    <a class="btn" href="/api/admin/export">Export approved (JSON)</a>
    <button class="btn" id="logout">Sign out</button>
  </div>
</header>

<form class="login" id="login" hidden>
  <h2 style="font-size:20px">Reviewer sign-in</h2>
  <label for="pw" style="font-weight:600;font-size:14px">Password</label>
  <input type="password" id="pw" autocomplete="current-password" required>
  <div class="error" id="loginErr"></div>
  <button class="btn primary" type="submit">Sign in</button>
</form>

<main id="app" hidden>
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <div class="lv" id="levels"></div>
  </div>
  <div class="list" id="list"></div>
</main>
<div class="toast" id="toast"></div>

<script src="islands.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GEO=window.MALDIVES||{atolls:[]};
const ATOLLS=[["national","Nationwide"],...GEO.atolls.map(a=>[a.id,a.name]).sort((a,b)=>a[1].localeCompare(b[1]))];
const PILLARS={prevention:"Prevention",support:"Survivor-centred support",justice:"Justice & accountability"};
const LEVELS={"":"All levels",individual:"Individuals",government:"Government",organisation:"Organisations"};
let META=[], view={status:"pending",level:""}, data={items:[],counts:{}};

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }

async function api(path,opts={}){
  const r=await fetch(path,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...opts});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ showLogin(); throw new Error("Signed out"); }
  if(!r.ok) throw new Error(j.error||"Request failed");
  return j;
}
function showLogin(){ $("login").hidden=false; $("app").hidden=true; $("topActions").hidden=true; $("pw").focus(); }
function showApp(){ $("login").hidden=true; $("app").hidden=false; $("topActions").hidden=false; load(); }

async function boot(){
  META=(await (await fetch("/api/meta")).json()).reporter_types;
  const s=await (await fetch("/api/admin/session",{credentials:"same-origin"})).json();
  if(!s.configured){ $("login").hidden=false; $("loginErr").textContent="The server has no ADMIN_PASSWORD set. Add it to the .env file and restart."; return; }
  s.admin ? showApp() : showLogin();
}
$("login").addEventListener("submit",async e=>{
  e.preventDefault(); $("loginErr").textContent="";
  try{ await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("pw").value})}); $("pw").value=""; showApp(); }
  catch(err){ $("loginErr").textContent=err.message; }
});
$("logout").onclick=async()=>{ await api("/api/admin/logout",{method:"POST"}).catch(()=>{}); showLogin(); };

async function load(){
  data=await api(`/api/admin/submissions?status=${view.status}`);
  render();
}
function render(){
  const c=data.counts, total=Object.values(c).reduce((a,b)=>a+b,0);
  const tab=(k,l,n)=>`<button class="tab" data-s="${k}" aria-pressed="${view.status===k}">${l}<em>${n??0}</em></button>`;
  $("tabs").innerHTML=tab("pending","Pending",c.pending)+tab("approved","Approved",c.approved)+tab("rejected","Rejected",c.rejected)+tab("all","All",total);
  $("levels").innerHTML=Object.entries(LEVELS).map(([k,l])=>`<button class="tab" data-l="${k}" aria-pressed="${view.level===k}">${l}</button>`).join("");
  const items=data.items.filter(i=>!view.level||i.level===view.level);
  $("list").innerHTML = items.length ? items.map(card).join("") :
    `<div class="empty">${view.status==="pending"?"Nothing waiting for review.":"No submissions here."}</div>`;
}
function opt(list,sel){ return list.map(([v,l])=>`<option value="${esc(v)}"${v===sel?" selected":""}>${esc(l)}</option>`).join(""); }
function card(i){
  const types=META.map(t=>[t.id,t.label]);
  return `<article class="item" data-id="${i.id}">
    <div>
      <textarea data-f="text" aria-label="Commitment text">${esc(i.text)}</textarea>
      <div class="fields">
        <label>Name shown<input data-f="org" value="${esc(i.org)}"></label>
        <label>Reporter type<select data-f="reporter_type">${opt(types,i.reporter_type)}</select></label>
        <label>Atoll<select data-f="atoll">${opt(ATOLLS,i.atoll)}</select></label>
        <label>Island<input data-f="island" value="${esc(i.island||"")}"></label>
        <label>Pillar<select data-f="pillar">${opt(Object.entries(PILLARS),i.pillar)}</select></label>
        ${i.level==="individual"?`<label>Show name publicly<select data-f="display_public">${opt([["1","Yes"],["0","No, withhold"]],String(i.display_public))}</select></label>`:""}
      </div>
    </div>
    <div class="side">
      <span class="status ${i.status}">${i.status}</span>
      <div><span class="lvl">${esc(LEVELS[i.level]||i.level)}</span> ${esc(i.reporter_label)}</div>
      <div>Submitted <b>${esc(new Date(i.created_at).toLocaleString())}</b></div>
      ${i.contact?`<div>Contact: <b>${esc(i.contact)}</b></div>`:""}
      ${i.reviewed_at?`<div>Reviewed ${esc(new Date(i.reviewed_at).toLocaleString())}</div>`:""}
      <input class="note" data-f="note" placeholder="Reviewer note (internal)" value="${esc(i.reviewer_note||"")}">
      <div class="actions">
        ${i.status!=="approved"?`<button class="btn approve" data-a="approve">Approve</button>`:""}
        ${i.status!=="rejected"?`<button class="btn reject" data-a="reject">Reject</button>`:""}
        <button class="btn" data-a="save">Save edits</button>
        ${i.status!=="pending"?`<button class="btn" data-a="pending">Back to pending</button>`:""}
      </div>
    </div>
  </article>`;
}
document.addEventListener("click",async e=>{
  const s=e.target.closest("[data-s]"); if(s){ view.status=s.dataset.s; return load(); }
  const l=e.target.closest("[data-l]"); if(l){ view.level=l.dataset.l; return render(); }
  const a=e.target.closest("[data-a]"); if(!a) return;
  const art=a.closest(".item"), body={action:a.dataset.a};
  art.querySelectorAll("[data-f]").forEach(el=>body[el.dataset.f]=el.value);
  a.disabled=true;
  try{
    await api(`/api/admin/submissions/${art.dataset.id}`,{method:"POST",body:JSON.stringify(body)});
    toast({approve:"Approved: now live on the board",reject:"Rejected",save:"Saved",pending:"Moved back to pending"}[body.action]);
    await load();
  }catch(err){ if(err.message!=="Signed out") toast(err.message); a.disabled=false; }
});
// refresh the queue every 30 s while on the pending tab and not editing
setInterval(()=>{ if(!$("app").hidden && view.status==="pending" && !document.activeElement.closest?.(".item")) load().catch(()=>{}); },30000);
boot();
</script>
</body>
</html>
